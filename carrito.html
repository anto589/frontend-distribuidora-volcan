<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Gas El Volcán</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark navbar-volcan mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1 fw-bold">🔥 Gas El Volcán</span>
    <a href="pedidos.html" class="btn btn-outline-light btn-sm">Ver Historial de Pedidos</a>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card card-custom p-4">
        <h3 class="mb-3 text-center">Realizar Pedido</h3>

        <!-- Seleccionar Formato de Gas -->
        <div class="mb-3">
          <label for="tipo-gas" class="form-label fw-bold">Selecciona el tipo de gas:</label>
          <select id="tipo-gas" class="form-select" onchange="calcularTotal()">
            <option value="16000">Cilindro 11 Kg - $16.000</option>
            <option value="21500" selected>Cilindro 15 Kg - $21.500</option>
            <option value="65000">Cilindro 45 Kg - $65.000</option>
          </select>
        </div>

        <!-- Seleccionar Cantidad -->
        <div class="mb-3">
          <label for="cantidad" class="form-label fw-bold">Cantidad:</label>
          <input type="number" id="cantidad" class="form-control" value="1" min="1" max="10" onchange="calcularTotal()" onkeyup="calcularTotal()">
        </div>

        <!-- Dirección de entrega -->
        <div class="mb-3">
          <label for="direccion" class="form-label fw-bold">Dirección de entrega:</label>
          <input type="text" id="direccion" class="form-control" placeholder="Ej: Av. Libertad 123">
        </div>

        <!-- Resumen de pago -->
        <div class="d-flex justify-content-between align-items-center my-3 p-3 bg-light rounded">
          <span class="fs-5">Total a Pagar:</span>
          <span class="fs-4 fw-bold text-danger">$<span id="monto-total">21500</span></span>
        </div>

        <button onclick="enviarPedidoBackend()" class="btn btn-volcan w-100 py-2">
          Confirmar y Pagar
        </button>
      </div>
    </div>
  </div>
</div>

<script src="js/carrito.js"></script>
</body>
</html>
